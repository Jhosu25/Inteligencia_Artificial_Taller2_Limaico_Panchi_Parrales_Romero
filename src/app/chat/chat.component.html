<div class="app-shell">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" [class.sidebar-closed]="!sidebarAbierta">
    <div class="sidebar-top">
      <button class="new-chat-btn" (click)="nuevaConversacion()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Nueva conversación</span>
      </button>
    </div>

    <nav class="conversation-list">
      <button
        *ngFor="let conv of conversaciones"
        class="conversation-item"
        [class.active]="conv.id === conversacionActivaId"
        (click)="seleccionarConversacion(conv.id)"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" class="conv-icon"><path d="M21 11.5C21 16.19 16.97 20 12 20C10.86 20 9.77 19.79 8.77 19.4L4 20.5L5.2 16.28C4.44 15.06 4 13.62 4 12.06C4 7.37 8.03 3.5 13 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>{{ conv.titulo }}</span>
      </button>
    </nav>

    <div class="sidebar-bottom">
      <div class="brand-mark">
        <span class="brand-dot"></span>
        <span>Taller Práctico 2 — IA</span>
      </div>
    </div>
  </aside>

  <!-- ===== Main panel ===== -->
  <main class="main-panel">
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <header class="topbar">
      <button class="icon-btn sidebar-toggle" (click)="toggleSidebar()" aria-label="Mostrar u ocultar barra lateral">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M9 4V20" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="app-name-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="app-logo"><path d="M12 2L14.5 9H21.5L15.75 13.5L18 20.5L12 16.5L6 20.5L8.25 13.5L2.5 9H9.5L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <h1 class="app-name">NEXUS<span>.AI</span></h1>
      </div>
      <span class="status-pill"><span class="status-dot"></span>en línea</span>
    </header>

    <section class="conversation-area" #scrollContainer>

      <!-- Empty state -->
      <div class="empty-state" *ngIf="mensajes.length === 0">
        <div class="hero-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9H21.5L15.75 13.5L18 20.5L12 16.5L6 20.5L8.25 13.5L2.5 9H9.5L12 2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </div>
        <h2>¿En qué puedo ayudarte hoy?</h2>
        <div class="prompt-chips">
          <button
            *ngFor="let p of promptsSugeridos"
            class="prompt-chip"
            (click)="usarPrompt(p)"
          >{{ p }}</button>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages" *ngIf="mensajes.length > 0">
        <div
          *ngFor="let msg of mensajes"
          class="message-block"
          [class.user-block]="msg.role === 'user'"
          [class.bot-block]="msg.role === 'bot'"
        >
          <div class="avatar bot-avatar" *ngIf="msg.role === 'bot'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9H21.5L15.75 13.5L18 20.5L12 16.5L6 20.5L8.25 13.5L2.5 9H9.5L12 2Z" fill="currentColor"/></svg>
          </div>
          <div class="message-content" [class.user-bubble]="msg.role === 'user'">
            <p>{{ msg.text }}</p>
          </div>
          <div class="avatar user-avatar" *ngIf="msg.role === 'user'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20C4 16.13 7.58 13 12 13C16.42 13 20 16.13 20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>
        </div>

        <div class="message-block bot-block" *ngIf="escribiendo">
          <div class="avatar bot-avatar pulse">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.5 9H21.5L15.75 13.5L18 20.5L12 16.5L6 20.5L8.25 13.5L2.5 9H9.5L12 2Z" fill="currentColor"/></svg>
          </div>
          <div class="message-content typing-indicator">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </section>

    <footer class="input-area">
      <div class="input-wrapper">
        <button class="icon-btn input-icon" aria-label="Adjuntar archivo" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05L12.25 20.24C10.07 22.42 6.53 22.42 4.35 20.24C2.17 18.06 2.17 14.52 4.35 12.34L13.54 3.15C14.99 1.7 17.32 1.7 18.77 3.15C20.22 4.6 20.22 6.93 18.77 8.38L10.13 17.02C9.4 17.75 8.23 17.75 7.5 17.02C6.77 16.29 6.77 15.12 7.5 14.39L15.5 6.39" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea
          #inputArea
          [(ngModel)]="entradaUsuario"
          (keydown)="manejarEnter($event)"
          (input)="autoResize()"
          placeholder="Escribe tu mensaje..."
          rows="1"
        ></textarea>
        <button
          class="send-button"
          (click)="enviarMensaje()"
          [disabled]="!entradaUsuario.trim() || escribiendo"
          aria-label="Enviar mensaje"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="disclaimer">Las respuestas son simuladas mientras se conecta el modelo entrenado.</p>
    </footer>

  </main>
</div>
